name: Marktwerte aktualisieren
on:
  schedule:
    - cron: "20 20 * * *"   # 22:20 Uhr Sommerzeit (MESZ)
    - cron: "20 21 * * *"   # 22:20 Uhr Winterzeit (MEZ)
    - cron: "10 6 * * *"    # Morgens als Sicherheitsnetz
  workflow_dispatch: {}      # Button "Run workflow" für manuelles Aktualisieren
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_data.py
      - name: Änderungen speichern
        run: |
          git config user.name "kickbase-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/players.json
          git diff --cached --quiet || (git commit -m "Daten aktualisiert" && git push)
