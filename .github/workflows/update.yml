
name: Marktwerte aktualisieren
on:
  schedule:
    - cron: "20 20 * * *"   # 22:20 Uhr Sommerzeit (MESZ)
    - cron: "20 21 * * *"   # 22:20 Uhr Winterzeit (MEZ)
    - cron: "10 6 * * *"    # Morgens als Sicherheitsnetz
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Daten holen und Prognose berechnen
        run: |
          python3 - <<'PY'
          import json, os, sys, datetime, urllib.request
 
          URL = "https://api.kbstats.de/api/v1/players"
          if os.environ.get("KB_SRC"):
              raw = json.load(open(os.environ["KB_SRC"], encoding="utf8"))
          else:
              req = urllib.request.Request(URL, headers={"User-Agent": "Mozilla/5.0 (kickbase-analyse)", "Accept": "application/json"})
              raw = json.load(urllib.request.urlopen(req, timeout=90))
 
 
          def num(v, d=None):
              if isinstance(v, bool):
                  return d
              if isinstance(v, (int, float)):
                  return v
              if isinstance(v, str):
                  try:
                      return float(v) if "." in v else int(v)
                  except ValueError:
                      return d
              return d
 
 
          def series(h):
              if isinstance(h, dict):
                  for k in ("history", "values", "data", "items", "marketValues"):
                      if isinstance(h.get(k), list):
                          h = h[k]
                          break
              if not isinstance(h, list):
                  return []
              out = []
              for e in h:
                  v = None
                  if isinstance(e, dict):
                      for k in ("marketValue", "mv", "value", "v", "m", "price"):
                          if num(e.get(k)) is not None:
                              v = num(e.get(k))
                              break
                  elif isinstance(e, (list, tuple)):
                      if len(e) >= 2:
                          v = num(e[-1])
                  else:
                      v = num(e)
                  if v is not None and v > 0:
                      out.append(float(v))
              return out
 
 
          players, API = [], {}
          for p in raw:
              if p.get("id") is None:
                  continue
              i = int(num(p["id"]))
              mv = int(num(p.get("marketValue"), 0))
              players.append({
                  "id": i, "t": int(num(p.get("teamId"), 0)), "fn": p.get("firstName") or "", "ln": p.get("lastName") or "",
                  "mv": mv, "avg": num(p.get("averagePoints")), "gp": num(p.get("gamesPlayed")), "pt": num(p.get("totalPoints")),
                  "st": int(num(p.get("status"), 0)), "pos": int(num(p.get("position"), 3)), "img": p.get("playerImage") or "",
                  "no": int(num(p.get("number"), 0)), "tr": int(num(p.get("trend"), 0)), "pr": int(num(p.get("startProbability"), 5)),
                  "ch": int(num(p.get("marketChangeToday"), 0)), "fc": None})
              s = series(p.get("history"))
              if len(s) > 1:
                  if abs(s[0] - mv) < abs(s[-1] - mv):
                      s = s[::-1]
                  API[i] = s
          if len(players) < 300:
              sys.exit("Abbruch: nur %d Spieler erhalten, alte Daten bleiben erhalten." % len(players))
          print("HISTORY-FORMAT:", type(raw[0].get("history")).__name__, str(raw[0].get("history"))[:160])
          print("Verlaeufe aus der Schnittstelle erkannt:", len(API), "von", len(players))
 
          # eigener Tagesverlauf (waechst mit jedem Lauf) als Reserve
          os.makedirs("data", exist_ok=True)
          H = json.load(open("data/history.json")) if os.path.exists("data/history.json") else {"d": [], "v": {}}
          cur = {str(p["id"]): p["mv"] for p in players}
          last = {k: v[-1] for k, v in H["v"].items() if v}
          same = bool(H["d"]) and sum(1 for k, v in cur.items() if last.get(k) == v) > 0.95 * len(cur)
          if not same:
              H["d"].append(datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d"))
              n = len(H["d"])
              for k, v in cur.items():
                  a = H["v"].setdefault(k, [])
                  a.extend([None] * (n - 1 - len(a)))
                  a.append(v)
              if n > 400:
                  H["d"] = H["d"][-400:]
                  H["v"] = {k: v[-400:] for k, v in H["v"].items()}
          json.dump(H, open("data/history.json", "w"), separators=(",", ":"))
 
          S, src = {}, "Schnittstelle"
          for p in players:
              own = [float(x) for x in H["v"].get(str(p["id"]), []) if x]
              a = API.get(p["id"], [])
              best = a if len(a) >= len(own) else own
              if len(best) > 1:
                  S[p["id"]] = best
          if not API:
              src = "eigene Tagesdaten"
 
 
          def clip(x):
              return max(-0.3, min(0.3, x))
 
 
          def feats(s, t):
              return [1.0, clip(s[t] / s[t - 1] - 1), clip(s[t - 1] / s[t - 2] - 1), clip(s[t - 2] / s[t - 3] - 1), clip(s[t] / s[t - 7] - 1)]
 
 
          def fit(X, Y):
              k = len(X[0])
              A = [[0.0] * (k + 1) for _ in range(k)]
              for x, y in zip(X, Y):
                  for a in range(k):
                      for b in range(k):
                          A[a][b] += x[a] * x[b]
                      A[a][k] += x[a] * y
              for a in range(k):
                  A[a][a] += 1e-6
              for c in range(k):
                  piv = max(range(c, k), key=lambda r: abs(A[r][c]))
                  A[c], A[piv] = A[piv], A[c]
                  if abs(A[c][c]) < 1e-12:
                      return None
                  for r in range(k):
                      if r != c:
                          f = A[r][c] / A[c][c]
                          for j in range(c, k + 1):
                              A[r][j] -= f * A[c][j]
              return [A[i][k] / A[i][i] for i in range(k)]
 
 
          TEST = 20
          trX, trY, teX, teY = [], [], [], []
          for s in S.values():
              n = len(s)
              for t in range(7, n - 1):
                  x, y = feats(s, t), clip(s[t + 1] / s[t] - 1)
                  (teX if n - 1 - t <= TEST else trX).append(x)
                  (teY if n - 1 - t <= TEST else trY).append(y)
          model = None
          if len(trX) > 2000:
              w = fit(trX, trY)
              if w:
                  pairs = [(sum(a * b for a, b in zip(w, x)), y, x[1]) for x, y in zip(teX, teY) if abs(y) > 1e-6]
                  acc = sum(1 for p, y, r1 in pairs if (p > 0) == (y > 0)) / max(1, len(pairs))
                  base = sum(1 for p, y, r1 in pairs if r1 != 0 and (r1 > 0) == (y > 0)) / max(1, len(pairs))
                  w = fit(trX + teX, trY + teY) or w
                  for p in players:
                      s = S.get(p["id"])
                      if s and len(s) >= 9:
                          pred = max(-0.2, min(0.2, sum(a * b for a, b in zip(w, feats(s, len(s) - 1)))))
                          p["fc"] = int(round(p["mv"] * pred))
                  model = {"days": TEST, "acc": round(acc * 100, 1), "base": round(base * 100, 1), "src": src,
                           "avglen": round(sum(len(s) for s in S.values()) / len(S))}
                  print("MODELL:", model, "Trainingsfaelle:", len(trX))
          else:
              print("MODELL: zu wenig Verlaufsdaten (", len(trX), "Faelle ) - noch keine Prognose")
 
          out = {"updated": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"), "model": model, "players": players}
          json.dump(out, open("data/players.json", "w", encoding="utf8"), ensure_ascii=False, separators=(",", ":"))
          print("OK", len(players), "Spieler")
          PY
      - name: Änderungen speichern
        run: |
          git config user.name "kickbase-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Daten aktualisiert" && git push)
