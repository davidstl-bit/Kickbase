name: Marktwerte aktualisieren
on:
  schedule:
    - cron: "20 20 * * *"   # 22:20 Uhr Sommerzeit (MESZ)
    - cron: "20 21 * * *"   # 22:20 Uhr Winterzeit (MEZ)
    - cron: "10 6 * * *"    # Morgens als Sicherheitsnetz
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Daten holen und Prognose berechnen
        run: |
          python3 - <<'PY'
          import json, os, sys, datetime, urllib.request

          URL = "https://api.kbstats.de/api/v1/players"
          if os.environ.get("KB_SRC"):
              raw = json.load(open(os.environ["KB_SRC"], encoding="utf8"))
          else:
              req = urllib.request.Request(URL, headers={"User-Agent": "Mozilla/5.0 (kickbase-analyse)", "Accept": "application/json"})
              raw = json.load(urllib.request.urlopen(req, timeout=90))


          def num(v, d=None):
              if isinstance(v, bool):
                  return d
              if isinstance(v, (int, float)):
                  return v
              if isinstance(v, str):
                  try:
                      return float(v) if "." in v else int(v)
                  except ValueError:
                      return d
              return d


          def lastpts(h):
              if isinstance(h, list):
                  for e in reversed(h):
                      if isinstance(e, dict) and e.get("hasPlayed") and num(e.get("points")) is not None:
                          return float(num(e["points"]))
              return None


          players, LP = [], {}
          for p in raw:
              if p.get("id") is None:
                  continue
              i = int(num(p["id"]))
              players.append({
                  "id": i, "t": int(num(p.get("teamId"), 0)), "fn": p.get("firstName") or "", "ln": p.get("lastName") or "",
                  "mv": int(num(p.get("marketValue"), 0)), "avg": num(p.get("averagePoints")), "gp": num(p.get("gamesPlayed")),
                  "pt": num(p.get("totalPoints")), "st": int(num(p.get("status"), 0)), "pos": int(num(p.get("position"), 3)),
                  "img": p.get("playerImage") or "", "no": int(num(p.get("number"), 0)), "tr": int(num(p.get("trend"), 0)),
                  "pr": int(num(p.get("startProbability"), 5)), "ch": int(num(p.get("marketChangeToday"), 0)), "fc": None})
              LP[i] = lastpts(p.get("history"))
          if len(players) < 300:
              sys.exit("Abbruch: nur %d Spieler erhalten, alte Daten bleiben erhalten." % len(players))

          # ---- Diagnose (nur Ausgabe im Log)
          print("FELDER:", sorted(raw[0].keys()))
          print("MARKETCHANGE:", str(raw[0].get("marketChange"))[:300])
          print("HISTORY-FORMAT:", str(raw[0].get("history"))[:120])
          if not os.environ.get("KB_SRC"):
              pid = raw[0].get("id")
              for suffix in ("/%s", "/%s/history", "/%s/market-value", "/%s/marketvalue", "/%s/chart"):
                  u = URL + suffix % pid
                  try:
                      r = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"}), timeout=20)
                      print("PROBE", u, r.status, r.read(240).decode("utf8", "ignore").replace("\n", " "))
                  except Exception as e:
                      print("PROBE", u, "->", str(e)[:60])

          # ---- eigene Tagesdaten: je Spieler pro Tag [Marktwert, Aenderung heute, Punkte letzter Spieltag, Startchance]
          os.makedirs("data", exist_ok=True)
          H = {"d": [], "p": {}}
          if os.path.exists("data/history.json"):
              old = json.load(open("data/history.json"))
              if "p" in old:
                  H = old
          last = {k: v[-1][0] for k, v in H["p"].items() if v and v[-1]}
          cur = {str(p["id"]): [p["mv"], p["ch"], LP[p["id"]], p["pr"]] for p in players}
          same = bool(H["d"]) and sum(1 for k, v in cur.items() if last.get(k) == v[0]) > 0.95 * len(cur)
          if not same:
              H["d"].append(datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d"))
              n = len(H["d"])
              for k, v in cur.items():
                  a = H["p"].setdefault(k, [])
                  a.extend([None] * (n - 1 - len(a)))
                  a.append(v)
              if n > 400:
                  H["d"] = H["d"][-400:]
                  H["p"] = {k: v[-400:] for k, v in H["p"].items()}
          json.dump(H, open("data/history.json", "w"), separators=(",", ":"))
          K = len(H["d"])
          print("Gesammelte Tage:", K)


          def clip(x, lo=-0.3, hi=0.3):
              return max(lo, min(hi, x))


          def feats(a, t):
              mv, ch, lp, pr = a[t]
              r1 = clip(ch / (mv - ch)) if mv - ch > 0 else 0.0
              r2 = 0.0
              if t > 0 and a[t - 1]:
                  m0, c0 = a[t - 1][0], a[t - 1][1]
                  r2 = clip(c0 / (m0 - c0)) if m0 - c0 > 0 else 0.0
              return [1.0, r1, r2, clip((lp or 0) / 200.0, -1, 1.5), 1.0 if pr <= 2 else 0.0]


          def fit(X, Y):
              k = len(X[0])
              A = [[0.0] * (k + 1) for _ in range(k)]
              for x, y in zip(X, Y):
                  for a in range(k):
                      for b in range(k):
                          A[a][b] += x[a] * x[b]
                      A[a][k] += x[a] * y
              for a in range(k):
                  A[a][a] += 1e-6
              for c in range(k):
                  piv = max(range(c, k), key=lambda r: abs(A[r][c]))
                  A[c], A[piv] = A[piv], A[c]
                  if abs(A[c][c]) < 1e-12:
                      return None
                  for r in range(k):
                      if r != c:
                          f = A[r][c] / A[c][c]
                          for j in range(c, k + 1):
                              A[r][j] -= f * A[c][j]
              return [A[i][k] / A[i][i] for i in range(k)]


          TEST = 2
          trX, trY, teX, teY = [], [], [], []
          for a in H["p"].values():
              for t in range(0, len(a) - 1):
                  if a[t] and a[t + 1] and a[t][0] > 0:
                      x, y = feats(a, t), clip(a[t + 1][0] / a[t][0] - 1)
                      late = (len(a) - 2 - t) < TEST
                      (teX if late else trX).append(x)
                      (teY if late else trY).append(y)
          model = None
          if K >= 5 and len(trX) > 800:
              w = fit(trX, trY)
              if w:
                  pairs = [(sum(u * v for u, v in zip(w, x)), y, x[1]) for x, y in zip(teX, teY) if abs(y) > 1e-6]
                  acc = sum(1 for p, y, r1 in pairs if (p > 0) == (y > 0)) / max(1, len(pairs))
                  base = sum(1 for p, y, r1 in pairs if r1 != 0 and (r1 > 0) == (y > 0)) / max(1, len(pairs))
                  w = fit(trX + teX, trY + teY) or w
                  for p in players:
                      a = H["p"].get(str(p["id"]))
                      if a and a[-1]:
                          pred = clip(sum(u * v for u, v in zip(w, feats(a, len(a) - 1))), -0.2, 0.2)
                          p["fc"] = int(round(p["mv"] * pred))
                  model = {"k": K, "n": len(trX) + len(teX), "days": TEST, "acc": round(acc * 100, 1), "base": round(base * 100, 1)}
                  print("MODELL:", model)
          else:
              print("MODELL: noch zu wenig eigene Tagesdaten (%d Tage, %d Faelle)" % (K, len(trX)))

          out = {"updated": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"), "collected": K, "model": model, "players": players}
          json.dump(out, open("data/players.json", "w", encoding="utf8"), ensure_ascii=False, separators=(",", ":"))
          print("OK", len(players), "Spieler")
          PY
      - name: Änderungen speichern
        run: |
          git config user.name "kickbase-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Daten aktualisiert" && git push)
